name: Build Release AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release Bundle
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Generated AAB
        run: |
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated at expected path: $AAB_FILE"
            exit 1
          fi
          
          echo "=========================================="
          echo "AAB Found: $AAB_FILE"
          echo "File size:"
          ls -lh "$AAB_FILE"
          echo "SHA-256 Checksum:"
          sha256sum "$AAB_FILE"
          echo "=========================================="
          
          echo "Validating AAB ZIP structure..."
          unzip -t "$AAB_FILE" > /dev/null
          echo "Valid ZIP structure confirmed."
          
          echo "Checking essential bundle files..."
          unzip -l "$AAB_FILE" | grep "BundleConfig.pb" || { echo "Missing BundleConfig.pb"; exit 1; }
          unzip -l "$AAB_FILE" | grep "base/manifest/AndroidManifest.xml" || { echo "Missing AndroidManifest.xml"; exit 1; }
          unzip -l "$AAB_FILE" | grep "base/resources.pb" || { echo "Missing resources.pb"; exit 1; }
          echo "AAB structure verification successful!"

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowTasks-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
