name: Build Release AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 9.3.1 directly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release Bundle using system Gradle
        run: |
          echo "Building with direct Gradle CLI (bypassing wrapper JAR)..."
          gradle --version
          gradle clean :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Generated Release AAB
        run: |
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated at expected path: $AAB_FILE"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$AAB_FILE" 2>/dev/null || stat -f%z "$AAB_FILE")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "ERROR: Generated AAB file size is unexpectedly small ($FILE_SIZE bytes)."
            exit 1
          fi
          
          echo "=================================================="
          echo "SUCCESS: Release AAB generated successfully!"
          echo "File path: $AAB_FILE"
          echo "File size in bytes: $FILE_SIZE"
          echo "Human-readable size: $(ls -lh "$AAB_FILE" | awk '{print $5}')"
          echo "SHA-256 Checksum: $(sha256sum "$AAB_FILE" | awk '{print $1}')"
          echo "=================================================="
          
          echo "Validating AAB ZIP and Bundle integrity..."
          unzip -t "$AAB_FILE" > /dev/null
          echo "ZIP structure: VALID"
          
          echo "Checking required Android App Bundle components..."
          unzip -l "$AAB_FILE" | grep "BundleConfig.pb" || { echo "Missing BundleConfig.pb"; exit 1; }
          unzip -l "$AAB_FILE" | grep "base/manifest/AndroidManifest.xml" || { echo "Missing AndroidManifest.xml"; exit 1; }
          unzip -l "$AAB_FILE" | grep "base/resources.pb" || { echo "Missing resources.pb"; exit 1; }
          unzip -l "$AAB_FILE" | grep "base/dex/" || { echo "Missing compiled DEX bytecode"; exit 1; }
          echo "AAB component check: ALL CRITICAL COMPONENTS PRESENT"

      - name: Upload FlowTasks-Release-AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowTasks-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
