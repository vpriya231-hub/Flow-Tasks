name: Build Release AAB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android Release App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Official Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          export PATH="/opt/gradle-9.3.1/bin:$PATH"
          gradle --version

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flow-tasks-upload.jks"
          chmod 600 "$RUNNER_TEMP/flow-tasks-upload.jks"

          if [ ! -s "$RUNNER_TEMP/flow-tasks-upload.jks" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/flow-tasks-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle clean :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Generated Release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/flow-tasks-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$AAB_FILE")

          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "ERROR: AAB is unexpectedly small."
            exit 1
          fi

          echo "AAB generated successfully."
          echo "File size: $FILE_SIZE bytes"
          echo "SHA-256: $(sha256sum "$AAB_FILE" | awk '{print $1}')"

          echo "Validating AAB ZIP structure..."
          unzip -t "$AAB_FILE" > /dev/null

          echo "Checking BundleConfig.pb..."
          unzip -l "$AAB_FILE" | grep "BundleConfig.pb" > /dev/null

          echo "Checking AndroidManifest.xml..."
          unzip -l "$AAB_FILE" | grep "base/manifest/AndroidManifest.xml" > /dev/null

          echo "Checking resources.pb..."
          unzip -l "$AAB_FILE" | grep "base/resources.pb" > /dev/null

          echo "Checking compiled DEX..."
          unzip -l "$AAB_FILE" | grep "base/dex/" > /dev/null

          echo "AAB structure verification passed."

      - name: Verify Release Signing Configuration
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/flow-tasks-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Signing keystore is missing."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Signing keystore and alias verification passed."

      - name: Upload Signed FlowTasks AAB
        uses: actions/upload-artifact@v4
        with:
          name: FlowTasks-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean Temporary Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/flow-tasks-upload.jks"
          echo "Temporary signing keystore removed."
