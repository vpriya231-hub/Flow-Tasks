name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup JDK 21
      # --------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # --------------------------------------------------
      # 4. Make Gradle executable
      # --------------------------------------------------
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x ./gradlew


      # --------------------------------------------------
      # 5. Restore NEW Release Keystore
      # --------------------------------------------------
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Restoring release keystore..."

          KEYSTORE_PATH="$RUNNER_TEMP/flow-tasks-upload.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          echo "Keystore restored."
          echo "Checking keystore..."

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

          echo "Keystore verification successful."


      # --------------------------------------------------
      # 6. Verify Gradle
      # --------------------------------------------------
      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version


      # --------------------------------------------------
      # 7. Build SIGNED Release AAB
      # --------------------------------------------------
      - name: Build Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/flow-tasks-upload.jks"

          echo "Building signed release AAB..."

          ./gradlew :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

          echo "AAB build completed."


      # --------------------------------------------------
      # 8. Verify Generated AAB
      # --------------------------------------------------
      - name: Verify Generated Release AAB
        run: |
          set -e

          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Release AAB found:"
          ls -lh "$AAB_FILE"


      # --------------------------------------------------
      # 9. Upload AAB
      # --------------------------------------------------
      - name: Upload Signed FlowTasks AAB
        uses: actions/upload-artifact@v4
        with:
          name: FlowTasks-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # --------------------------------------------------
      # 10. Clean Temporary Keystore
      # --------------------------------------------------
      - name: Clean Temporary Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/flow-tasks-upload.jks"
          echo "Temporary keystore removed."
