name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # RESTORE UPLOAD KEYSTORE
      # --------------------------------------------------

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "=========================================="
          echo "Restoring release keystore..."
          echo "=========================================="

          mkdir -p "$RUNNER_TEMP/keystore"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/flow-tasks-upload.jks"

          echo "Keystore file created."

          echo "Checking keystore integrity..."

          keytool -list \
            -v \
            -keystore "$RUNNER_TEMP/keystore/flow-tasks-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/keystore-info.txt"

          echo "Keystore integrity: OK"

          echo "Checking alias..."

          keytool -list \
            -keystore "$RUNNER_TEMP/keystore/flow-tasks-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Alias check: OK"
          echo "Alias: $KEY_ALIAS"

      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Verify Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      # --------------------------------------------------
      # BUILD SIGNED AAB
      # --------------------------------------------------

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/flow-tasks-upload.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew

          ./gradlew clean :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # VERIFY AAB
      # --------------------------------------------------

      - name: Verify Generated Release AAB
        run: |
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$AAB_FILE")

          echo "=========================================="
          echo "SUCCESS: Release AAB generated!"
          echo "=========================================="
          echo "File: $AAB_FILE"
          echo "Size: $(ls -lh "$AAB_FILE" | awk '{print $5}')"
          echo "SHA256:"
          sha256sum "$AAB_FILE"
          echo "=========================================="

          unzip -t "$AAB_FILE" > /dev/null

          echo "AAB ZIP integrity: OK"

      # --------------------------------------------------
      # UPLOAD ARTIFACT
      # --------------------------------------------------

      - name: Upload Signed FlowTasks AAB
        uses: actions/upload-artifact@v4
        with:
          name: FlowTasks-Signed-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # CLEANUP
      # --------------------------------------------------

      - name: Clean Temporary Keystore
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keystore"
          echo "Temporary keystore removed."
